name: Finalize repository helper paths 2026-09-01

on:
  push:
    paths:
      - '.github/workflows/reorganize_repo_260901.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update helper paths
        run: bash .github/tools/reorganize_repo_260901.sh
      - name: Commit helper path updates
        run: |
          git config user.name 'chatgpt-repo-organizer'
          git config user.email 'chatgpt-repo-organizer@users.noreply.github.com'
          git add .github/tools
          if git diff --cached --quiet; then
            echo 'No helper changes.'
          else
            git commit -m 'Update validation helpers for organized paths'
            git push
          fi
