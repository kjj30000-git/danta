name: Build v1.6.10

on:
  push:
    branches:
      - chatgpt/v1.6.10-build
    paths:
      - .github/workflows/build_v1610.yml
      - .github/tools/build_v1_6_10.py
      - .github/tools/validate_v1_6_10.py
      - .github/triggers/build_v1610.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/v1.6.10-build
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Hotfix builder quoting
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('.github/tools/build_v1_6_10.py'); s=p.read_text(encoding='utf-8'); a=r'EXIT_STRATEGIES[LIVE_STRATEGY][\"tp\"]'; b=r'EXIT_STRATEGIES[LIVE_STRATEGY][\"sl\"]'; assert s.count(a)+s.count(b)==2; s=s.replace(a,r\"EXIT_STRATEGIES[LIVE_STRATEGY][\\'tp\\']\").replace(b,r\"EXIT_STRATEGIES[LIVE_STRATEGY][\\'sl\\']\"); p.write_text(s,encoding='utf-8')"

      - name: Build notebook
        run: >-
          python .github/tools/build_v1_6_10.py
          code/releases/015_260903_v1.6.9.ipynb
          code/releases/016_260904_v1.6.10.ipynb

      - name: Validate and finalize notebook
        run: >-
          python .github/tools/validate_v1_6_10.py
          code/releases/016_260904_v1.6.10.ipynb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1610-notebook
          path: code/releases/016_260904_v1.6.10.ipynb
          if-no-files-found: error

      - name: Commit validated notebook
        shell: bash
        run: |
          git config user.name chatgpt-v1610-builder
          git config user.email chatgpt-v1610-builder@users.noreply.github.com
          git add code/releases/016_260904_v1.6.10.ipynb
          if git diff --cached --quiet; then
            echo No generated changes.
          else
            git commit -m 'Build validated 016_260904_v1.6.10 from exact v1.6.9 parent'
            git push origin chatgpt/v1.6.10-build
          fi
