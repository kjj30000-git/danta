name: Fix v1.6.8 tempfile import

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/fix_v168_tempfile.txt'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix builder tempfile import guard
        run: python .github/tools/fix_v168_tempfile_import.py
      - name: Compile builder
        run: python -m py_compile .github/tools/build_v1_6_8.py
      - name: Commit fix
        run: |
          git config user.name 'chatgpt-v168-final'
          git config user.email 'chatgpt-v168-final@users.noreply.github.com'
          git add .github/tools/build_v1_6_8.py
          if git diff --cached --quiet; then
            echo 'No builder changes.'
          else
            git commit -m 'Fix v1.6.8 top-level tempfile import generation'
            git push
          fi
