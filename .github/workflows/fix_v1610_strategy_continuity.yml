name: Repair v1.6.10 strategy and continuity

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/fix_v1610_strategy_continuity.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair notebook
        run: python .github/tools/fix_v1610_strategy_continuity.py

      - name: Validate repaired notebook
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path
          p=Path('code/releases/016_260904_v1.6.10.ipynb')
          nb=json.loads(p.read_text(encoding='utf-8'))
          assert [c.get('id') for c in nb['cells']] == ['v1610-settings','v1610-program','v1610-quick-reference','v1610-continuity']
          for c in nb['cells']:
              if c.get('cell_type')=='code':
                  compile(''.join(c['source']), c['id'], 'exec')
          settings=''.join(nb['cells'][0]['source'])
          program=''.join(nb['cells'][1]['source'])
          continuity=''.join(nb['cells'][3]['source'])
          assert 'LIVE_STRATEGY = "T250_S150"' in settings
          assert 'LIVE_STRATEGY != "T250_S150"' not in program
          assert 'EXIT_STRATEGIES.get(LIVE_STRATEGY)' in program
          assert '2026-08-17 (월)' in continuity
          assert '2026-09-02 (수)' in continuity
          assert '2026-09-03 (목) v1.6.10 후속 수정' in continuity

          ns={}
          exec(compile(settings,'settings','exec'),ns)
          ns['EXIT_STRATEGIES']={'T200_S150':{'tp':2.0,'sl':-1.5},'T250_S150':{'tp':2.5,'sl':-1.5},'T300_S200':{'tp':3.0,'sl':-2.0}}
          tree=ast.parse(program)
          funcs=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in {'_logical_live_config_check','validate_live_trading_config'}]
          exec(compile(ast.Module(body=funcs,type_ignores=[]),'validation-functions','exec'),ns)
          for strategy in ['T200_S150','T250_S150','T300_S200']:
              ns['LIVE_STRATEGY']=strategy
              assert ns['validate_live_trading_config']() is True
          ns['LIVE_STRATEGY']='TYPO_STRATEGY'
          try:
              ns['validate_live_trading_config']()
              raise AssertionError('undefined strategy accepted')
          except ValueError:
              pass
          print('STRATEGY_SWITCH_REGRESSION_OK')
          print('CONTINUITY_APPEND_ONLY_CHECK_OK')
          PY

      - name: Commit repaired notebook
        run: |
          git config user.name chatgpt-v1610-repair
          git config user.email chatgpt-v1610-repair@users.noreply.github.com
          git add code/releases/016_260904_v1.6.10.ipynb
          if git diff --cached --quiet; then
            echo No repaired changes.
          else
            git commit -m 'Repair v1.6.10 strategy configurability and continuity history'
            git push origin main
          fi
